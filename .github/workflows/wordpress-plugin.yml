name: WordPress Plugin

on:
  push:
    branches: [main]
    paths:
      - 'wordpress-plugin/numpo/**'
      - '.github/workflows/wordpress-plugin.yml'
  pull_request:
    paths:
      - 'wordpress-plugin/numpo/**'
      - '.github/workflows/wordpress-plugin.yml'

permissions:
  contents: read

jobs:
  test:
    name: PHPUnit / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: wordpress-plugin/numpo
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, zip, intl, mysqli, pdo, pdo_mysql
          tools: composer
          coverage: none
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y mysql-client
        working-directory: .
      - name: Validate Composer
        run: composer validate --strict
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Install WordPress test environment
        env:
          WP_INSTALL_TESTS_SKIP_UPDATE_CHECK: 'true'
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 latest
      - name: PHP syntax
        run: |
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: PHPUnit
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
        run: vendor/bin/phpunit -c phpunit.xml.dist

  build:
    name: Build installable plugin ZIP
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build ZIP
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/numpo
          rsync -a wordpress-plugin/numpo/ dist/numpo/             --exclude='.git'             --exclude='tests'             --exclude='vendor'             --exclude='composer.json'             --exclude='phpunit.xml.dist'             --exclude='bin'
          test -f dist/numpo/numpo.php
          (cd dist && zip -qr numpo.zip numpo)
          unzip -t dist/numpo.zip
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: numpo-wordpress-plugin
          path: dist/numpo.zip
          if-no-files-found: error
