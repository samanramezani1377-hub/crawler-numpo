name: Go
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: numpo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d numpo_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: test -z "$(gofmt -l .)"
      - run: go build -v ./...
        env:
          NUMPO_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/numpo_test?sslmode=disable
      - run: go test ./...
        env:
          NUMPO_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/numpo_test?sslmode=disable
      - run: go test -race ./...
        env:
          NUMPO_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/numpo_test?sslmode=disable
      - run: go vet ./...
